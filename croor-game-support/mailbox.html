<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CROOR GAME - Mailbox</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <header class="ios-header">
        <div class="header-content">
            <div class="header-left">
                <a href="index.html" class="back-btn">
                    <i class="fas fa-chevron-left"></i>
                </a>
                <div class="header-text">
                    <h1>Mailbox</h1>
                    <p>Your Submitted Forms</p>
                </div>
            </div>
            <div class="header-right">
                <button class="clear-btn" onclick="clearAllMails()">
                    <i class="fas fa-trash-alt"></i>
                    Clear All
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content mailbox-content">
        <div class="mailbox-container" id="mailboxContainer">
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">
                    <i class="fas fa-inbox"></i>
                </div>
                <h3>No Submissions Yet</h3>
                <p>Your submitted forms will appear here</p>
                <a href="index.html" class="ios-link-btn">
                    <i class="fas fa-plus-circle"></i>
                    Submit a Form
                </a>
            </div>
            <div class="mail-list" id="mailList"></div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="ios-bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="mailbox.html" class="nav-item active">
            <i class="fas fa-envelope"></i>
            <span>Mailbox</span>
        </a>
    </nav>

    <script src="js/app.js"></script>
</body>
</html>
